<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071322">
  <title>오프라인 | BYTE BACK</title>
  <style>
    body {
      box-sizing: border-box;
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #071322;
      color: #eef3f6;
      font: 16px/1.65 system-ui, sans-serif;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }
    main { width: 100%; max-width: 30rem; }
    h1 { margin: 0 0 16px; font-size: clamp(24px, 5vw, 32px); line-height: 1.35; }
    p { margin: 8px 0; color: #b7c6d1; }
    a {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      margin-top: 12px;
      color: #9fd4c8;
      text-underline-offset: .25em;
    }
    a:focus-visible { outline: 2px solid currentColor; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>자료실에 연결할 수 없습니다</h1>
    <p>보호 메모를 열려면 인터넷 연결과 기기 인증이 필요합니다. 메모 내용과 인증 토큰은 오프라인에 저장하지 않습니다.</p>
    <p>연결이 복구되면 자료실을 다시 열어 주세요.</p>
    <a href="/">자료실 다시 열기</a>
  </main>
</body>
</html>
