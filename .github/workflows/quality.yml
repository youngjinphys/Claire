name: Quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Node runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
          cache: npm
      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts
      - name: Prior-stage defense regression tests
        run: npm test
      - name: Non-production local build
        run: npm run build -- --local
      - name: Claire syntax checks
        run: npm --prefix on-client run check
      - name: Claire loopback HTTP integration tests
        run: npm --prefix on-client test
